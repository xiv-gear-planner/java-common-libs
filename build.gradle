plugins {
	id 'base'
	id 'io.micronaut.library' apply false
}

group = 'app.xivgear'
version = '1.0-SNAPSHOT'

allprojects {
	apply {
		repositories {
			mavenCentral()
		}
	}
}

subprojects {
	// Apply plugins
	apply plugin: 'groovy'
	apply plugin: 'java-library'

	// Set group and version for all subprojects
	group = 'app.xivgear'
	version = '1.0-SNAPSHOT'

	// Configure repositories for all subprojects
	repositories {
		mavenCentral()
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25) // Adjust version as needed
		}
	}


	// Configure dependencies for all subprojects
	dependencies {
//		api platform("io.micronaut.platform:micronaut-platform:5.0.1")
		api 'org.apache.groovy:groovy:4.0.14'
		testImplementation platform('org.junit:junit-bom:5.10.0')
		testImplementation 'org.junit.jupiter:junit-jupiter'
	}

	// Configure test task for all subprojects
	test {
		useJUnitPlatform()
	}
}